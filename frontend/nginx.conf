# Serves the SPA, proxies /api to Django and caches NEXRAD radar tiles.
# Rendered by the nginx image's envsubst step (API_UPSTREAM).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
proxy_cache_path /var/cache/nginx/radar levels=1:2 keys_zone=radar:10m max_size=200m inactive=30m use_temp_path=off;

# Real client IP from Cloudflare -> Traefik.
real_ip_header X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 90s;
    }

    # Observed NEXRAD base reflectivity from Iowa Environmental Mesonet (public domain).
    location ~ ^/radar/(\d+)/(\d+)/(\d+)\.png$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/$1/$2/$3.png;
        proxy_ssl_server_name on;
        proxy_set_header Host mesonet.agron.iastate.edu;
        proxy_cache radar;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        expires 5m;
    }

    # Note: no add_header inside locations, so the server-level security headers apply everywhere.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
